<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5496"/></marker></defs>
<rect x="30" y="20" width="292" height="78" rx="8" fill="#DCE6F5"/>
<text x="176.0" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">1단계: 호감</text>
<text x="176.0" y="80" text-anchor="middle" font-size="14" fill="#1B2A4A">배경만 서술해 몰입, NPC에게 호감</text>
<rect x="334" y="20" width="292" height="78" rx="8" fill="#B9CCEA"/>
<text x="480.0" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">2단계: 의심, 불안</text>
<text x="480.0" y="80" text-anchor="middle" font-size="14" fill="#1B2A4A">실마리가 1단계의 호감과 부딪힘</text>
<rect x="638" y="20" width="292" height="78" rx="8" fill="#1B2A4A"/>
<text x="784.0" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3단계: 혼란과 선택</text>
<text x="784.0" y="80" text-anchor="middle" font-size="14" fill="#fff">정체를 밝히는 '누가'를 마지막에</text>
<rect x="30" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="100.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 1</text>
<text x="100.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">언제</text>
<line x1="171" y1="171" x2="181" y2="171" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="182" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="252.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 2</text>
<text x="252.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">어디서</text>
<line x1="323" y1="171" x2="333" y2="171" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="334" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="404.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 3</text>
<text x="404.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">무엇을</text>
<line x1="475" y1="171" x2="485" y2="171" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="486" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="556.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 4</text>
<text x="556.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">어떻게</text>
<line x1="627" y1="171" x2="637" y2="171" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="638" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="708.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 5</text>
<text x="708.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">왜</text>
<line x1="779" y1="171" x2="789" y2="171" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="790" y="128" width="140" height="86" rx="8" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
<text x="860.0" y="160" text-anchor="middle" font-size="13" fill="#666">방 6</text>
<text x="860.0" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">누가</text>
<line x1="860.0" y1="216" x2="860.0" y2="252" stroke="#2F5496" stroke-width="2" marker-end="url(#a)"/>
<rect x="750.0" y="258" width="220" height="50" rx="25" fill="#2F5496"/>
<text x="860.0" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">엔딩 선택 3종</text>
<text x="30" y="290" font-size="14" fill="#666">방을 지날수록 호감, 의심, 혼란이 쌓이고, 마지막 방의 정체 공개가 선택으로 이어진다</text>
</svg>